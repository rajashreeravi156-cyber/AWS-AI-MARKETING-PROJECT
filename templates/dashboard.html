<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - AWS AI Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #1a0033 0%, #2d1b69 50%, #1a0033 100%); min-height: 100vh; color: white; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    <nav class="glass fixed w-full top-0 z-50 border-b border-purple-400/20">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">AWS Admin Portal</h1>
            <div class="flex items-center gap-4">
                <a href="/products" class="text-yellow-400 hover:text-yellow-300 font-bold mr-4">🛍️ Products</a>
                <a href="/logout" class="px-4 py-2 text-sm border border-pink-400/30 rounded hover:bg-pink-400/20">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 pt-28 pb-10">
        <div class="flex justify-between items-end mb-10">
            <div>
                <h2 class="text-4xl font-bold mb-2">Admin Dashboard</h2>
                <p class="text-gray-400">Overview of system performance.</p>
            </div>
            <div class="flex gap-3">
                <a href="/campaign_history" class="px-6 py-3 glass rounded-lg font-bold hover:bg-white/10 transition">
                    📜 History
                </a>
                <a href="/new_campaign" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-lg font-bold shadow-lg hover:scale-105 transition">
                    + New Campaign
                </a>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="glass p-6 rounded-xl border border-white/5">
                <h3 class="text-gray-400 text-sm mb-1">Total Users</h3>
                <p class="text-3xl font-bold text-yellow-400">12,450</p>
            </div>
            <div class="glass p-6 rounded-xl border border-white/5">
                <h3 class="text-gray-400 text-sm mb-1">AI Requests</h3>
                <p class="text-3xl font-bold text-pink-400">850</p>
            </div>
            <div class="glass p-6 rounded-xl border border-white/5">
                <h3 class="text-gray-400 text-sm mb-1">Active Campaigns</h3>
                <p class="text-3xl font-bold text-purple-400">4</p>
            </div>
        </div>
    </div>
</body>
</html>
