<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campaign History - AWS AI Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #1a0033 0%, #2d1b69 50%, #1a0033 100%); min-height: 100vh; color: white; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    <nav class="glass fixed w-full top-0 z-50 border-b border-purple-400/20">
        <div class="container mx-auto px-6 py-4 flex justify-between">
            <h1 class="text-xl font-bold text-purple-300">Campaign History</h1>
            <a href="/dashboard" class="text-gray-300 hover:text-white">← Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mx-auto px-6 pt-24">
        <h2 class="text-3xl font-bold mb-6">🚀 Active & Past Campaigns</h2>
        
        <div class="glass rounded-xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-black/30 text-gray-300 uppercase text-sm">
                    <tr>
                        <th class="p-4">Date</th>
                        <th class="p-4">Campaign Name</th>
                        <th class="p-4">Target Audience</th>
                        <th class="p-4">Budget</th>
                        <th class="p-4">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-white/10">
                    {% for c in campaigns %}
                    <tr class="hover:bg-white/5 transition">
                        <td class="p-4 text-gray-400">{{ c.date }}</td>
                        <td class="p-4 font-bold">{{ c.name }}</td>
                        <td class="p-4 text-sm">{{ c.audience }}</td>
                        <td class="p-4 text-green-400">${{ c.budget }}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded text-xs bg-purple-500/20 text-purple-300">{{ c.status }}</span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
        <div class="mt-8 text-center">
            <a href="/new_campaign" class="inline-block px-6 py-3 border border-purple-500 text-purple-300 rounded hover:bg-purple-500/20 transition">
                + Launch Another Campaign
            </a>
        </div>
    </div>
</body>
</html>
