<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - AWS AI Marketing Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #1a0033 0%, #2d1b69 50%, #1a0033 100%); min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    <nav class="glass fixed w-full top-0 z-50 border-b border-purple-400/20">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">AWS AI Marketing</h1>
            <a href="/" class="text-purple-200 hover:text-white">Home</a>
        </div>
    </nav>
    
    <div class="min-h-screen flex items-center justify-center px-4 pt-20">
        <div class="glass p-8 rounded-2xl w-full max-w-md">
            <h2 class="text-3xl font-bold text-white mb-6 text-center">Welcome Back</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-purple-200 mb-2">Email</label>
                    <input type="email" id="email" class="w-full p-3 rounded bg-black/30 border border-purple-400/30 text-white" placeholder="you@example.com" required>
                </div>
                <div>
                    <label class="block text-purple-200 mb-2">Password</label>
                    <input type="password" id="password" class="w-full p-3 rounded bg-black/30 border border-purple-400/30 text-white" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded font-bold hover:scale-105 transition">Sign In</button>
            </form>
            <div id="message" class="text-center mt-4"></div>
            <p class="text-center text-purple-300 mt-4">Don't have an account? <a href="/signup" class="text-pink-400 font-bold">Sign Up</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            const email = document.getElementById('email').value;
            
            msg.innerHTML = '<span class="text-yellow-400">Logging in...</span>';
            
            // ACTUAL SERVER LOGIN REQUEST
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email })
                });
                
                if (res.ok) {
                    msg.innerHTML = '<span class="text-green-400">✓ Success! Redirecting...</span>';
                    window.location.href = '/dashboard'; // Redirects to Dashboard
                } else {
                    msg.innerHTML = '<span class="text-red-400">Login Failed</span>';
                }
            } catch (err) {
                console.error(err);
                // Fallback for demo if fetch fails
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
